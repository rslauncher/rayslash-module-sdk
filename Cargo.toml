[workspace]
members = ["crates/rayslash-module-manifest", "crates/rayslash-module-tool"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rslauncher/rayslash-module-sdk"

[workspace.dependencies]
base64 = "0.22.1"
clap = { version = "4.5.53", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand = "0.8.5"
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = "0.4.44"
thiserror = "2.0.17"
toml = "0.9.8"
walkdir = "2.5.0"
zstd = "0.13.3"

