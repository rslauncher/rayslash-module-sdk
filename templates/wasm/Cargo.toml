[package]
name = "rayslash-module-example"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/example/rayslash-module-example"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[package.metadata.component]
package = "example:module"

[package.metadata.component.target]
path = "wit"
world = "module"

[workspace]
